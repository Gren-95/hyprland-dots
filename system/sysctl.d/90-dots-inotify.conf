# Installed by `dots.sh setup` to /etc/sysctl.d/.
#
# Each process that watches files holds inotify instances, and every user may
# hold only 128 by default. When they run out, the session D-Bus cannot reload
# its config (it does on every Flatpak install or removal) and dies, taking
# the whole session with it. The shell, editors, file managers and browsers
# all hold some, so give the user room.
fs.inotify.max_user_instances = 1024
