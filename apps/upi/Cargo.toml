[package]
name = "upi"
version = "0.1.0"
edition = "2024"
description = "Update everything on the Hyprland dots machine: check, snapshot, then dnf, firmware, Flatpak, AppImages, npm, uv, bun and fisher"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
lto = "thin"
strip = true
