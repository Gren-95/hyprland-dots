# Hypridle configuration - improved for clarity, maintainability, and efficiency

general {
    # Prevent multiple hyprlock instances
    lock_cmd = pidof hyprlock || (bash ~/.config/scripts/hyprlock-art.sh; hyprlock)

    # Fetch art, then lock before suspend. Deliberately ";" and not "&&":
    # with "&&" a non-zero exit from the art script skipped the lock entirely,
    # so suspending with no media player running left the session unlocked.
    before_sleep_cmd = bash ~/.config/scripts/hyprlock-art.sh; loginctl lock-session

    # Wake the display and restore brightness after sleep.
    # History: Hyprland 0.55.x + older i915 left a stuck atomic page-flip
    # ("Cannot commit when a page-flip is awaiting") that only a VT-cycle
    # (chvt 3->2) could clear. That bug no longer reproduces on Hyprland
    # 0.56.2 / kernel 7.2+ (multiple suspend/resume cycles, zero page-flip
    # errors), so the VT-flash and DPMS dance are gone. If a frozen/black
    # lockscreen returns on resume, see memory hyprland-resume-freeze.
    # wireplumber goes braindead across a hibernate (suspend-to-disk) resume:
    # audio graph stops routing, so media (e.g. YouTube) buffers but never
    # starts playback. Restarting it on resume fixes it; cheap enough to do
    # on every wake.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'; brightnessctl -r; systemctl --user restart wireplumber
}

# Dim screen after 2.5 minutes of inactivity
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10      # Set monitor backlight to minimum (avoid 0 for OLED)
    on-resume = brightnessctl -r              # Restore monitor backlight
}

# Keyboard backlight off after 2.5 minutes (optional, comment if not needed)
listener {
    timeout = 150
    on-timeout = brightnessctl -sd rgb:kbd_backlight set 0
    on-resume = brightnessctl -rd rgb:kbd_backlight
}

# Lock screen after 5 minutes of inactivity
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Turn off display after 8 minutes of inactivity, restore on activity
listener {
    timeout = 480
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on")' && brightnessctl -r
}

# Suspend system after 15 minutes of inactivity
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
