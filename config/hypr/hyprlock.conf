# hyprlock — two columns over a blurred wallpaper.
#
#   left  : date, clock, now playing (album art from hyprlock-art.sh)
#   right : avatar, user name, password
#   top-left corner     : weather (hyprlock-weather.sh)
#   top-right corner    : battery
#   bottom-right corner : suspend / hibernate / reboot / power off
#
# Colors mirror quickshell/Theme.qml: fg #fafaf9, muted #a8a29e,
# bg #1c1917, popupBorder #78716c, accent orange #ff7a1a, red #ff4d5e,
# yellow #ffc531. hyprlock cannot read the shell's accent setting, so if
# the accent changes there, change ACCENT below to match.
# In hyprlang "#" starts a comment, so a literal "#" is written "##".

$ACCENT = rgba(255, 122, 26, 1.0)
$FG     = rgba(250, 250, 249, 1.0)
$MUTED  = rgba(168, 162, 158, 1.0)
$FONT   = Iosevka Nerd Font
$COL_X  = 140

general {
    hide_cursor = false
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = easeOut, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 4, easeOut
    animation = fadeOut, 1, 4, easeOut
    animation = inputFieldDots, 1, 2, easeOut
}

background {
    monitor =
    path = ~/.config/hypr/lockbg
    blur_passes = 2
    blur_size = 4
    brightness = 0.55
    vibrancy = 0.15
}

# ───────────────────────── left column ─────────────────────────

# DATE — small, accented, above the clock
label {
    monitor =
    text = cmd[update:60000] date +'%A  ·  %d %B'
    color = $ACCENT
    font_size = 18
    font_family = $FONT
    shadow_passes = 2
    shadow_size = 4
    position = $COL_X, 165
    halign = left
    valign = center
}

# CLOCK
label {
    monitor =
    text = <b>$TIME</b>
    color = $FG
    font_size = 150
    font_family = $FONT
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.45)
    position = $COL_X, 50
    halign = left
    valign = center
}

# NOW PLAYING — art is absent when nothing plays, and the labels print
# nothing, so the block disappears on its own.
image {
    monitor =
    path = /tmp/hyprlock-art.jpg
    size = 64
    rounding = 12
    border_size = 0
    reload_time = 3
    reload_cmd = bash ~/.config/scripts/hyprlock-art.sh --print
    position = $COL_X, -110
    halign = left
    valign = center
}

label {
    monitor =
    text = cmd[update:2000] bash ~/.config/scripts/hyprlock-status.sh title
    color = $FG
    font_size = 15
    font_family = $FONT
    shadow_passes = 2
    shadow_size = 4
    position = 224, -97
    halign = left
    valign = center
}

label {
    monitor =
    text = cmd[update:2000] bash ~/.config/scripts/hyprlock-status.sh artist
    color = $MUTED
    font_size = 13
    font_family = $FONT
    shadow_passes = 2
    shadow_size = 4
    position = 224, -123
    halign = left
    valign = center
}

# ───────────────────────── right column ────────────────────────
# Right edges line up at -140.

image {
    monitor =
    path = ~/.config/hypr/avatar.png
    size = 120
    rounding = -1
    border_size = 3
    border_color = $ACCENT
    position = -140, 115
    halign = right
    valign = center
}

label {
    monitor =
    text = <b>$USER</b>
    color = $FG
    font_size = 22
    font_family = $FONT
    shadow_passes = 2
    shadow_size = 4
    position = -140, 20
    halign = right
    valign = center
}

input-field {
    monitor =
    size = 340, 56
    rounding = 12
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(120, 113, 108, 0.9)
    inner_color = rgba(28, 25, 23, 0.85)
    font_color = $FG
    font_family = $FONT
    fade_on_empty = false
    placeholder_text = <span foreground="##a8a29e">Password</span>
    check_color = $ACCENT
    fail_color = rgba(255, 77, 94, 1.0)
    fail_text = <i>$FAIL  ($ATTEMPTS)</i>
    fail_transition = 120
    capslock_color = rgba(255, 197, 49, 1.0)
    position = -140, -50
    halign = right
    valign = center
}

# ───────────────────────── corners ─────────────────────────────

# WEATHER — mirrors the battery in the opposite corner
label {
    monitor =
    text = cmd[update:600000] bash ~/.config/scripts/hyprlock-weather.sh
    color = $MUTED
    font_size = 14
    font_family = $FONT
    shadow_passes = 2
    shadow_size = 4
    position = 56, -40
    halign = left
    valign = top
}

# BATTERY
label {
    monitor =
    text = cmd[update:30000] bash ~/.config/scripts/hyprlock-status.sh battery
    color = $MUTED
    font_size = 14
    font_family = $FONT
    shadow_passes = 2
    shadow_size = 4
    position = -56, -40
    halign = right
    valign = top
}

# POWER — right to left: power off, reboot, hibernate, suspend.
# Glyphs are padded with no-break spaces (U+00A0): Nerd Font icons draw
# wider than their advance width, so a bare glyph gets clipped at the label
# edge. Plain spaces would not work, hyprlang trims them.
label {
    monitor =
    text =  󰐥 
    color = rgba(255, 77, 94, 0.85)
    font_size = 20
    font_family = $FONT
    onclick = systemctl poweroff
    position = -56, 48
    halign = right
    valign = bottom
}

label {
    monitor =
    text =  󰜉 
    color = $MUTED
    font_size = 20
    font_family = $FONT
    onclick = systemctl reboot
    position = -126, 48
    halign = right
    valign = bottom
}

label {
    monitor =
    text =  󰒲 
    color = $MUTED
    font_size = 20
    font_family = $FONT
    onclick = systemctl hibernate
    position = -196, 48
    halign = right
    valign = bottom
}

label {
    monitor =
    text =  󰤄 
    color = $MUTED
    font_size = 20
    font_family = $FONT
    onclick = systemctl suspend
    position = -266, 48
    halign = right
    valign = bottom
}
