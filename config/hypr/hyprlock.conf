# hyprlock — two stacked panels: time+date on top, password+power below.

background {
    monitor =
    path = ~/.config/hypr/lockbg
    blur_passes = 0
    brightness = 0.85
}

general {
    hide_cursor = false
}

# ── PANEL 1: time + date ──────────────── (declared before labels = behind)
shape {
    monitor =
    size = 640, 270
    color = rgba(0, 0, 0, 0.65)
    rounding = 28
    border_size = 1
    border_color = rgba(255, 255, 255, 0.10)
    position = 0, 405
    halign = center
    valign = center
}

# ── PANEL 2: password + power ───────────
shape {
    monitor =
    size = 400, 64
    color = rgba(0, 0, 0, 0.65)
    rounding = 28
    border_size = 1
    border_color = rgba(255, 255, 255, 0.10)
    position = 0, 60
    halign = center
    valign = bottom
}

# ── PANEL 3: profile pic + password (center) ──
shape {
    monitor =
    size = 360, 110
    color = rgba(0, 0, 0, 0.65)
    rounding = 28
    border_size = 1
    border_color = rgba(255, 255, 255, 0.10)
    position = 0, 0
    halign = center
    valign = center
}

# CLOCK
label {
    monitor =
    text = cmd[update:5000] date +"%H:%M"
    color = rgba(255, 255, 255, 0.95)
    font_size = 120
    font_family = Iosevka Nerd Font
    position = 0, 450
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(255, 255, 255, 0.60)
    font_size = 36
    font_family = Iosevka Nerd Font
    position = 0, 320
    halign = center
    valign = center
}

# PASSWORD
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.25)
    inner_color = rgba(0, 0, 0, 0.45)
    font_color = rgba(255, 255, 255, 1.0)
    fade_on_empty = false
    font_family = Iosevka Nerd Font
    placeholder_text = Password
    check_color = rgba(136, 192, 208, 1.0)
    # Wrong password: fast bright-red flash (hyprlock has no shake).
    fail_color = rgba(230, 60, 70, 1.0)
    fail_transition = 120
    fail_text = <i>  $FAIL  ($ATTEMPTS)</i>
    position = 0, 0
    halign = center
    valign = center
}

# ── POWER — under the password, inside panel 2 ──
label {
    monitor =
    text =   󰤄    
    color = rgba(255, 255, 255, 0.50)
    font_size = 24
    font_family = Iosevka Nerd Font
    onclick = systemctl suspend
    position = -135, 72
    halign = center
    valign = bottom
}

label {
    monitor =
    text =   󰒲    
    color = rgba(255, 255, 255, 0.50)
    font_size = 24
    font_family = Iosevka Nerd Font
    onclick = systemctl hibernate
    position = -45, 72
    halign = center
    valign = bottom
}

label {
    monitor =
    text =   󰜉    
    color = rgba(255, 255, 255, 0.50)
    font_size = 24
    font_family = Iosevka Nerd Font
    onclick = reboot now
    position = 45, 72
    halign = center
    valign = bottom
}

label {
    monitor =
    text =   󰐥    
    color = rgba(255, 77, 94, 0.60)
    font_size = 24
    font_family = Iosevka Nerd Font
    onclick = shutdown now
    position = 135, 72
    halign = center
    valign = bottom
}
