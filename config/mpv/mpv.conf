# mpv — video player and background music player (the `music` fish function
# and Super+Shift+M both run `mpv --no-video --shuffle ~/Music/*`).
#
# Colors and fonts follow the quickshell theme (config/quickshell/Theme.qml):
# fg #fafaf9, fgOnAccent #0c0a09, font Iosevka Nerd Font.

# ── Video output ─────────────────────────────────────────────────────────────
# libplacebo renderer; hwdec picks VA-API on the Intel iGPU (iHD driver) and
# only uses decoders known to be safe, falling back to software otherwise.
vo=gpu-next
hwdec=auto-safe
# Time video to the display refresh and resample audio to match: no judder.
video-sync=display-resample

# ── Window ───────────────────────────────────────────────────────────────────
autofit-larger=90%x90%
# Bare video: no title bar or window decorations, and no on-screen controller.
# Keys and the mouse wheel still work, and seeking and volume show a thin bar.
border=no
osc=no
# Resume where you left off after quitting with Q.
save-position-on-quit=yes

# ── Languages and streaming ──────────────────────────────────────────────────
alang=en,eng
slang=en,eng
sub-auto=fuzzy
# yt-dlp is installed; cap streams at 1080p for the integrated GPU.
ytdl-format=bestvideo[height<=?1080]+bestaudio/best

# ── Screenshots (same folder as swappy) ──────────────────────────────────────
screenshot-dir=~/Pictures/Screenshots
screenshot-format=png
screenshot-template=mpv-%F-%P

# ── On-screen text ───────────────────────────────────────────────────────────
osd-font=Iosevka Nerd Font
osd-color="#fafaf9"
osd-border-color="#0c0a09"
# Slimmer, shorter seek and volume bar.
osd-bar-w=40
osd-bar-h=2
# Subtitles use the system sans for readability; Iosevka is monospace.
sub-font=Noto Sans
sub-color="#fafaf9"
sub-border-color="#0c0a09"

# ── Profiles ─────────────────────────────────────────────────────────────────
# Audio files: no resume points are written for every track the music player
# skips through.
[music]
save-position-on-quit=no
gapless-audio=yes

# Apply the music profile by file extension. A section holds one profile
# reference, so each extension gets its own.
[extension.mp3]
profile=music

[extension.flac]
profile=music

[extension.opus]
profile=music

[extension.ogg]
profile=music

[extension.m4a]
profile=music

[extension.wav]
profile=music
