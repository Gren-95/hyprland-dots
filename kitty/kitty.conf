# Enable Wayland support
wayland_titlebar_color background

# Font settings
font_family      Iosevka Nerd Font
bold_font       auto
italic_font     auto
bold_italic_font auto
font_size       12.0

# Cursor
cursor_shape    beam
cursor_blink    no

# Window settings
enable_audio_bell no
dynamic_background_opacity yes
background_opacity 0.95
confirm_os_window_close 0

default_layout  tall

# Colors (Tailwind Stone palette, dark mode / Adwaita Dark inspired)

foreground            #fafaf9
background            #1c1917
selection_foreground  #1c1917
selection_background  #78716c

color0   #292524
color8   #78716c

color1   #ff4d5e
color9   #ff8a96

color2   #2ee59d
color10  #8ff5c8

color3   #ffc531
color11  #ffe08a

color4   #4c9aff
color12  #a6ccff

color5   #b57bff
color13  #d7bcff

color6   #2ee6d6
color14  #9ff5ec

color7   #e7e5e4
color15  #fafaf9

# Scrolling
scrollback_lines 5000

# SSH settings
# Leave TERM at kitty's default (xterm-kitty). Forcing xterm-256color
# disables the kitty graphics protocol, which breaks ranger image
# previews and kitten icat. For remote hosts that lack the xterm-kitty
# terminfo entry, kitty's ssh kitten (`kitten ssh user@host`) deploys
# the right terminfo automatically.
allow_remote_control socket-only
# Abstract per-instance socket: no predictable /tmp path, and several kitty
# instances no longer fight over one socket. Needed by socket-only remote control.
listen_on unix:@kitty-{kitty_pid}
clipboard_control write-clipboard write-primary

# Automatically copy terminfo to remote hosts
shell_integration enabled

# New window/tab keeps cwd; with kitten ssh this reopens same remote host+dir
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t new_tab_with_cwd

# Keybindings
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+w close_tab
